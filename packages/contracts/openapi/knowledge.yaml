openapi: 3.1.0
info:
  title: xe6-tsy Knowledge Configuration API
  version: 0.1.0-placeholder
  description: >-
    Placeholder contract for knowledge ingestion, review, publication, reads,
    and retirement. Every operation returns 501 until a later implementation stage.
x-implementation-status: placeholder
x-todo: >-
  Implement authorization, repositories, audit recording, file parsing, source
  validation, and publication versioning before adding success responses. Runtime
  RAG retrieval remains a separate knowledge-module responsibility.
paths:
  /api/v1/configuration/knowledge/import-jobs:
    post:
      operationId: createKnowledgeImportJob
      summary: Create a knowledge import job
      tags: [knowledge-configuration]
      x-todo: >-
        Authorize the maintainer, validate FORM/FILE metadata, create an idempotent
        job, delegate parsing to a port, and keep all candidates unpublished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeImportJobRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/configuration/knowledge/import-items/{import_item_id}/reviews:
    post:
      operationId: reviewKnowledgeImportItem
      summary: Record a human review decision
      tags: [knowledge-configuration]
      x-todo: >-
        Persist an authorized human decision, reason and corrections with source
        traceability, optimistic concurrency, sensitive-content checks, and audit.
      parameters:
        - name: import_item_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewKnowledgeImportItemRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/configuration/knowledge/publications:
    post:
      operationId: createKnowledgePublication
      summary: Publish reviewed knowledge entries
      tags: [knowledge-configuration]
      x-todo: >-
        Verify reviewed entries and approved sources, create an immutable manifest
        atomically, retain the previous version on failure, and test concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgePublicationRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/configuration/knowledge/bases/{knowledge_base_id}/publications/{publication_id}:
    get:
      operationId: getPublishedKnowledgeBundle
      summary: Read a versioned published knowledge bundle
      tags: [knowledge-configuration]
      x-todo: >-
        Authorize the exact organization/version read, return immutable entries and
        source references, and prevent cross-organization existence disclosure.
      parameters:
        - name: knowledge_base_id
          in: path
          required: true
          schema:
            type: string
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
        - name: version_number
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/configuration/knowledge/publications/{publication_id}/retirements:
    post:
      operationId: retireKnowledgePublication
      summary: Retire a knowledge publication
      tags: [knowledge-configuration]
      x-todo: >-
        Authorize the actor, retire with optimistic concurrency, retain historical
        manifests and references, audit the action, and make retries idempotent.
      parameters:
        - name: publication_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireKnowledgePublicationRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  schemas:
    CreateKnowledgeImportJobRequest:
      type: object
      additionalProperties: false
      required: [organization_id, knowledge_base_id, input_mode, idempotency_key]
      properties:
        organization_id:
          type: string
        knowledge_base_id:
          type: string
        input_mode:
          type: string
          enum: [FORM, FILE]
        source_file_ref:
          type: string
        source_sha256:
          type: string
          minLength: 64
          maxLength: 64
        idempotency_key:
          type: string
    ReviewKnowledgeImportItemRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_version]
      properties:
        decision:
          type: string
          enum: [ACCEPTED, CORRECTED, REJECTED]
        reason_code:
          type: string
        corrected_payload:
          type: object
          additionalProperties: true
        expected_version:
          type: integer
          format: int64
          minimum: 1
    CreateKnowledgePublicationRequest:
      type: object
      additionalProperties: false
      required: [organization_id, knowledge_base_id, entry_version_ids, idempotency_key]
      properties:
        organization_id:
          type: string
        knowledge_base_id:
          type: string
        entry_version_ids:
          type: array
          minItems: 1
          items:
            type: string
        idempotency_key:
          type: string
    RetireKnowledgePublicationRequest:
      type: object
      additionalProperties: false
      required: [reason, expected_version]
      properties:
        reason:
          type: string
        expected_version:
          type: integer
          format: int64
          minimum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              const: NOT_IMPLEMENTED
            message:
              type: string
  responses:
    NotImplemented:
      description: The knowledge capability is not implemented yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
